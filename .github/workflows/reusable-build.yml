name: Build (Reusable)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
      architecture:
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      LANG: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Describe
        run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build Project
        env:
          # 只允许注入「可以公开」的值：PCL_WRITE_SECRET 会让 EnvironmentInteropGenerator
          # 把下面这些 PCL_* 变量的值明文编译进二进制，任何人都能反编译看到。
          #
          # PCL_CURSEFORGE_API_KEY 因此被刻意移除。CurseForge 的 API Key 一旦随发行包分发，
          # 等于把申请来的 Key 交给所有使用者共用，官方会按「多客户端复用同一 Key」处置并封禁，
          # 连带影响上游项目。正确做法是让使用者把 Key 填进本地 secrets.json
          # （见 PCL.Core/Utils/OS/EnvironmentInterop.cs 的 ReadLocalSecret），没填时启动器自行降级。
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          dotnet publish "PCL-Harness Edition/Plain Craft Launcher 2.csproj" \
          -p:Configuration=${{ inputs.configuration }} -p:Platform=${{ inputs.architecture }} \
          -p:DeleteExistingFiles=true -o ./artifact --self-contained true \
          -p:EnableCompressionInSingleFile=true

      - name: Upload the Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PCL_HE_${{ inputs.configuration }}_${{ inputs.architecture }}
          path: artifact/**
