name: Release publish

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (Beta is published as prerelease)'
        required: true
        default: Beta
        type: choice
        options:
          - Release
          - Beta
      version:
        description: 'Version to release (e.g., 2.14.2)'
        required: false
        type: string
  # 推送 v* 标签即可发版，不必依赖手工触发；手工触发时 version 留空表示取标签名。
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - configuration: ${{ github.event.inputs.configuration || 'Beta' }}
            architecture: x64
          - configuration: ${{ github.event.inputs.configuration || 'Beta' }}
            architecture: ARM64
      fail-fast: false

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: ${{ matrix.configuration }}
      architecture: ${{ matrix.architecture }}
    secrets: inherit

  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: git-cliff

      - name: Create local release tag
        run: git tag -f "v${{ github.event.inputs.version || replace(github.ref_name, 'v', '') }}"

      - name: Generate changelog
        run: git-cliff --latest -o CHANGELOG.md

      - name: Create or update release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: v${{ github.event.inputs.version || replace(github.ref_name, 'v', '') }}
          name: Release ${{ github.event.inputs.version || replace(github.ref_name, 'v', '') }}
          body_path: CHANGELOG.md
          prerelease: ${{ (github.event.inputs.configuration || 'Beta') == 'Beta' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rename_and_release:
    needs: [build, changelog]
    permissions:
      actions: read
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - configuration: ${{ github.event.inputs.configuration || 'Beta' }}
            architecture: x64
          - configuration: ${{ github.event.inputs.configuration || 'Beta' }}
            architecture: ARM64
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PCL_HE_${{ matrix.configuration }}_${{ matrix.architecture }}
          path: ./artifact

      - name: Package the whole publish output
        run: |
          # 产物是 --no-self-contained 的目录，exe 旁边还有 PCL.Core.dll 与 runtimes/ 下的原生库。
          # 只挑 exe 上传会让下载者拿到一份缺依赖、双击即报错的文件，所以整目录打包；
          # 进到目录里再打包，解压出来就直接是程序文件，不会多套一层 artifact/。
          cd ./artifact
          zip -r "../PCL_HE_${{ matrix.configuration }}_${{ matrix.architecture }}.zip" .

      - name: Sign the archive
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: PCL_HE_${{ matrix.configuration }}_${{ matrix.architecture }}.zip
          verify: true
          verify-cert-identity: https://github.com/Sherlock-9522/PCL-HE/.github/workflows/release-publish.yml@refs/heads/main
          verify-oidc-issuer: https://token.actions.githubusercontent.com

      - name: Upload binary and signature to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: v${{ github.event.inputs.version || replace(github.ref_name, 'v', '') }}
          files: |
            PCL_HE_${{ matrix.configuration }}_${{ matrix.architecture }}.zip
            PCL_HE_${{ matrix.configuration }}_${{ matrix.architecture }}.zip.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_draft:
    needs: [rename_and_release]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ github.event.inputs.version || replace(github.ref_name, 'v', '') }}
