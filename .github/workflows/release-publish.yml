name: Release publish

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (Beta is published as prerelease)'
        required: true
        default: Beta
        type: choice
        options:
          - Release
          - Beta
      version:
        description: 'Full tag to release (e.g., v0.1.2)'
        required: false
        type: string
  # 推送 v* 标签即可发版，不必依赖手工触发；手工触发时 version 留空表示取标签名。
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - configuration: ${{ github.event.inputs.configuration || 'Beta' }}
            architecture: x64
            variant: selfcontained
          - configuration: ${{ github.event.inputs.configuration || 'Beta' }}
            architecture: ARM64
            variant: selfcontained
          - configuration: ${{ github.event.inputs.configuration || 'Beta' }}
            architecture: x64
            variant: slim
          - configuration: ${{ github.event.inputs.configuration || 'Beta' }}
            architecture: ARM64
            variant: slim
      fail-fast: false

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: ${{ matrix.configuration }}
      architecture: ${{ matrix.architecture }}
      variant: ${{ matrix.variant }}
    secrets: inherit

  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: git-cliff

      - name: Create local release tag
        run: git tag -f "${{ github.event.inputs.version || github.ref_name }}"

      - name: Generate changelog
        run: git-cliff --latest -o CHANGELOG.md

      - name: Create or update release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          body_path: CHANGELOG.md
          prerelease: ${{ (github.event.inputs.configuration || 'Beta') == 'Beta' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rename_and_release:
    needs: [build, changelog]
    permissions:
      actions: read
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - configuration: ${{ github.event.inputs.configuration || 'Beta' }}
            architecture: x64
            variant: selfcontained
          - configuration: ${{ github.event.inputs.configuration || 'Beta' }}
            architecture: ARM64
            variant: selfcontained
          - configuration: ${{ github.event.inputs.configuration || 'Beta' }}
            architecture: x64
            variant: slim
          - configuration: ${{ github.event.inputs.configuration || 'Beta' }}
            architecture: ARM64
            variant: slim
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PCL_HE_${{ matrix.configuration }}_${{ matrix.architecture }}_${{ matrix.variant }}
          path: ./artifact

      - name: Resolve package name
        id: pkg
        # 产物名要让人一眼看懂：PCL-HE_v0.1.2-Alpha_win-x64_self-contained.zip
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          case "${{ matrix.architecture }}" in
            ARM64) arch="arm64" ;;
            *) arch="x64" ;;
          esac
          case "${{ matrix.variant }}" in
            selfcontained) variant="self-contained" ;;
            slim) variant="framework-dependent" ;;
            *) variant="${{ matrix.variant }}" ;;
          esac
          echo "name=PCL-HE_${version}_win-${arch}_${variant}" >> "$GITHUB_OUTPUT"

      - name: Package the whole publish output
        run: |
          # 两种形态都整目录打包，下载者解压后不会缺依赖：
          #   selfcontained —— 目录里只有 PCL-HE.exe 一个文件（开箱即用）；
          #   slim         —— 目录里有 exe 与全部第三方 DLL（需预装 .NET 10 桌面运行时）。
          # 进到目录里再打包，解压出来就直接是程序文件，不会多套一层 artifact/。
          # 同时把《PCL 存储库合理使用指南》随包分发：指南要求「继续使用本文件作为指南」，
          # 只放在仓库里而下载包中看不到，容易被质疑没有随附协议。
          cp "PCL-Harness Edition/LICENCE" ./artifact/LICENCE
          cd ./artifact
          zip -r "../${{ steps.pkg.outputs.name }}.zip" .

      - name: Sign the archive
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ${{ steps.pkg.outputs.name }}.zip
          verify: true
          # 证书里的 SAN 是触发这次运行的那个 ref：tag 触发时是 refs/tags/vX.Y.Z，
          # 手工触发时是 refs/heads/main。写成固定值会让 tag 触发的运行验签失败。
          verify-cert-identity: https://github.com/Sherlock-9522/PCL-HE/.github/workflows/release-publish.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com

      - name: Upload binary and signature to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            ${{ steps.pkg.outputs.name }}.zip
            ${{ steps.pkg.outputs.name }}.zip.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_draft:
    needs: [rename_and_release]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
